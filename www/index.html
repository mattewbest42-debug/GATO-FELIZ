<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi gato</title>
<style>
@property --s { syntax: "<number>"; inherits: true; initial-value: 1; }
:root {
  --blanco:#fbfbfb; --g1:#ececec; --g2:#cfcfcf; --g3:#8d8d8d; --g4:#555; --raya:#262626;
  --oro:#f6b02a; --oro2:#e48a00; --rosa:#ff6b8b; --cielo:#3aa8e8; --verde:#4cc46a; --noche:#6c5ce7;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; font-family:"Trebuchet MS","Segoe UI",sans-serif; color:var(--raya); min-height:100vh;
  background:repeating-linear-gradient(115deg,#f3f3f3 0 22px,#e2e2e2 22px 27px,#f3f3f3 27px 58px,#d3d3d3 58px 61px);
}
.app { max-width:720px; margin:0 auto; padding:12px; padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:12px; }
.oculto { display:none !important; }
button { font:inherit; cursor:pointer; color:inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--cielo); outline-offset:2px; }

/* Barra superior */
.top { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:18px; color:#fff;
  background:linear-gradient(#444,#262626); border-bottom:4px solid var(--oro); }
.avatar { width:58px; height:58px; border-radius:50%; border:3px solid var(--oro); background-color:#888; flex:none; }
.info { flex:1; min-width:0; }
.nombre { display:flex; align-items:center; gap:6px; font-weight:bold; font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nivel { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:.8rem; font-weight:bold; }
.xp { flex:1; height:15px; background:#666; border-radius:8px; position:relative; overflow:hidden; }
.xp div { height:100%; width:0; background:linear-gradient(90deg,#ffd35a,var(--oro2)); transition:width .5s; }
.xp span { position:absolute; inset:0; text-align:center; font-size:.7rem; line-height:15px; }
.monedas { background:linear-gradient(#ffd35a,var(--oro)); color:var(--raya); border:3px solid var(--oro2);
  border-radius:20px; padding:4px 10px; font-weight:bold; white-space:nowrap; }

/* Escena */
.escena { position:relative; overflow:hidden; border-radius:18px; border:3px solid var(--raya); box-shadow:0 6px 0 #0003;
  aspect-ratio:4/3; display:flex; align-items:flex-end; background:#999; }
@media (min-width:560px) { .escena { aspect-ratio:16/10; } }
.fondo { position:absolute; inset:-30px; background-size:cover; background-position:center; filter:blur(18px) saturate(1.4) brightness(.95); }
.gato { position:relative; width:100%; height:100%; display:flex; align-items:flex-end; transform-origin:50% 100%; }
.gato.salta { animation:salto .6s ease; }
.foto { width:100%; max-height:100%; object-fit:contain; object-position:bottom; display:block;
  transform-origin:50% 100%; transform:scale(var(--s)); transition:--s .8s ease, filter .6s;
  animation:respira 4s ease-in-out infinite; }
.escena.duerme .foto { filter:brightness(.6) saturate(.8); animation-duration:7s; }
.chip { position:absolute; top:10px; left:10px; z-index:2; background:#000a; color:#fff; border-radius:14px;
  padding:5px 12px; font-size:.85rem; font-weight:bold; border:2px solid var(--oro); }
.p { position:absolute; bottom:30%; font-size:1.7rem; pointer-events:none; z-index:3; animation:sube 1.8s ease-out both; }
.p.cae { bottom:auto; top:6%; animation:cae 1.1s ease-in both; }
@keyframes respira { 0%,100% { transform:scale(var(--s)); } 50% { transform:scale(calc(var(--s) * 1.01), calc(var(--s) * 1.028)); } }
@keyframes salto { 35% { transform:translateY(-14px) scale(1.03); } 100% { transform:none; } }
@keyframes sube { 0% { opacity:0; transform:translateY(0) scale(.6); } 15% { opacity:1; } 100% { opacity:0; transform:translateY(-140px) scale(1.25); } }
@keyframes cae { 0% { opacity:0; transform:translateY(-8px) rotate(0); } 20% { opacity:1; } 100% { opacity:0; transform:translateY(130px) rotate(200deg); } }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
#aviso { margin:0; min-height:1.3em; text-align:center; font-weight:bold; color:var(--g4); }

/* Contadores y felicidad */
.contadores { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.cont { text-align:center; background:#fff; border:3px solid var(--raya); border-radius:14px; padding:6px 2px; }
.cont strong { display:block; font-size:1.5rem; }
.cont span { font-size:.75rem; color:var(--g4); }
.cont.a { border-top-color:var(--cielo); border-top-width:8px; }
.cont.b { border-top-color:var(--oro); border-top-width:8px; }
.cont.c { border-top-color:var(--rosa); border-top-width:8px; }
.feliz { display:flex; align-items:center; gap:10px; background:#fff; border:3px solid var(--raya); border-radius:16px; padding:8px 12px; font-weight:bold; }
.feliz .barra { flex:1; height:16px; background:var(--g1); border-radius:9px; overflow:hidden; border:2px solid var(--g3); }
.feliz .barra div { height:100%; width:0; background:repeating-linear-gradient(135deg,var(--verde) 0 10px,#39ad58 10px 20px); transition:width .5s; }

/* Botones de acción */
.acciones { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.accion { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 2px 8px;
  border:3px solid var(--raya); border-radius:16px; box-shadow:0 4px 0 var(--raya); font-weight:bold; font-size:.78rem; background:#fff; }
.accion:active { transform:translateY(3px); box-shadow:0 1px 0 var(--raya); }
.accion i { font-style:normal; font-size:1.8rem; }
.accion.oro { background:linear-gradient(#ffd35a,var(--oro)); }
.accion.rosa { background:linear-gradient(#ffa6bb,var(--rosa)); }
.accion.cielo { background:linear-gradient(#8fd3ff,var(--cielo)); }
.accion.noche { background:linear-gradient(#a99dff,var(--noche)); color:#fff; }
.tag { position:absolute; top:-9px; right:-6px; background:#e63946; color:#fff; border-radius:12px; padding:1px 7px; font-size:.7rem; border:2px solid #fff; }
.extra { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.suave { background:#fff; border:2px solid var(--g3); border-radius:12px; padding:8px 14px; font-size:.9rem; }

/* Formulario */
.panel { background:#fff; border:3px solid var(--raya); border-radius:18px; padding:16px; border-top:10px solid var(--oro); }
.panel h2 { margin:0 0 12px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:480px) { .grid { grid-template-columns:1fr; } }
label { display:block; font-size:.85rem; color:var(--g4); margin-bottom:4px; }
input, select { width:100%; padding:10px; font-size:1rem; border:2px solid var(--g3); border-radius:10px; background:var(--blanco); }
.guardar { margin-top:14px; width:100%; padding:12px; font-weight:bold; font-size:1.05rem; border:3px solid var(--raya); border-radius:14px; background:linear-gradient(#ffd35a,var(--oro)); box-shadow:0 4px 0 var(--raya); }
</style>
</head>
<body>
<div class="app">

  <section class="panel" id="panelForm">
    <h2>Datos de tu gato</h2>
    <div class="grid">
      <div><label for="nombre">Nombre</label><input id="nombre" maxlength="30" placeholder="Ej: Michi"></div>
      <div><label for="raza">Tipo de gato (raza)</label><input id="raza" maxlength="30" placeholder="Ej: Mestizo, Siamés"></div>
      <div><label for="color">Color</label>
        <select id="color">
          <option>Gris y blanco</option><option>Gris</option><option>Blanco</option><option>Negro</option>
          <option>Naranja</option><option>Café</option><option>Atigrado</option><option>Otro</option>
        </select></div>
      <div><label for="edad">Edad (años)</label><input id="edad" type="number" min="0" max="30" step="0.5" placeholder="Ej: 2"></div>
      <div><label for="meta">Comidas por día</label><input id="meta" type="number" min="1" max="10" value="3"></div>
    </div>
    <button class="guardar" id="guardar">Guardar</button>
    <p class="extra"><button class="suave oculto" id="cancelar">Cancelar</button></p>
  </section>

  <div id="juego" class="oculto" style="display:grid;gap:12px">
    <div class="top">
      <div class="avatar" id="avatar"></div>
      <div class="info">
        <div class="nombre"><span id="vNombre"></span></div>
        <div class="nivel">⭐ Nv. <span id="vNivel">1</span>
          <div class="xp"><div id="xpBarra"></div><span id="xpTxt"></span></div></div>
      </div>
      <div class="monedas">🪙 <span id="vMonedas">0</span></div>
    </div>

    <div class="escena" id="escena">
      <div class="fondo" id="fondo"></div>
      <div class="chip" id="chip"></div>
      <div class="gato" id="gato"><img class="foto" id="foto" alt="Foto de tu gato"></div>
    </div>
    <p id="aviso" role="status"></p>

    <div class="contadores">
      <div class="cont a"><strong id="cHoy">0</strong><span>comidas hoy</span></div>
      <div class="cont b"><strong id="cMeta">3</strong><span>meta diaria</span></div>
      <div class="cont c"><strong id="cTotal">0</strong><span>comidas en total</span></div>
    </div>

    <div class="feliz">😺 Felicidad <div class="barra"><div id="fBarra"></div></div> <span id="fTxt">0%</span></div>

    <div class="acciones">
      <button class="accion oro" id="bAlimentar"><i>🥣</i>Alimentar<span class="tag" id="tagHoy">0/3</span></button>
      <button class="accion rosa" id="bCarino"><i>💖</i>Cariño</button>
      <button class="accion cielo" id="bJugar"><i>🎾</i>Jugar</button>
      <button class="accion noche" id="bDormir"><i>😴</i><span id="tDormir">Dormir</span></button>
    </div>

    <div class="extra">
      <button class="suave" id="bFoto">📷 Cambiar foto</button>
      <button class="suave" id="bEditar">✏️ Editar datos</button>
      <button class="suave" id="bReiniciar">↺ Reiniciar</button>
    </div>
    <input type="file" id="archivo" accept="image/*" class="oculto">
  </div>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var reducir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var estado = cargar();
  function cargar() {
    try {
      var s = JSON.parse(localStorage.getItem(CLAVE));
      if (s) return Object.assign({ xp: 0, nivel: 1, monedas: 0, feliz: 80, feliz_t: Date.now(), durmiendo: false, foto: null }, s);
    } catch (e) {}
    return null;
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); }
    catch (e) { alert("No se pudo guardar. Prueba con una foto más pequeña."); }
  }

  function dia(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  function comidasHoy() { var h = dia(new Date()); return estado.log.filter(function (t) { return dia(new Date(t)) === h; }).length; }
  function etapa(t) { return t < 5 ? "Gatito" : t < 15 ? "Gato joven" : t < 30 ? "Gato adulto" : "Gato grande"; }
  function escala(t) { return 0.72 + Math.min(t, 60) / 60 * 0.28; }
  function feliz() { return Math.max(0, Math.round(estado.feliz - (Date.now() - estado.feliz_t) / 36e5 * 3)); }
  function sumarFeliz(n) { estado.feliz = Math.min(100, feliz() + n); estado.feliz_t = Date.now(); }
  function ganar(xp, monedas) {
    estado.xp += xp; estado.monedas += monedas;
    while (estado.xp >= 200 * estado.nivel) {
      estado.xp -= 200 * estado.nivel; estado.nivel++;
      spawn("🎉", 6); aviso("¡" + estado.nombre + " subió al nivel " + estado.nivel + "!");
    }
  }

  function aviso(t) { $("aviso").textContent = t; }
  function spawn(emoji, n, clase) {
    if (reducir) return;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "p " + (clase || "");
      s.textContent = emoji;
      s.style.left = (12 + Math.random() * 72) + "%";
      s.style.animationDelay = (i * 0.12) + "s";
      s.addEventListener("animationend", function () { this.remove(); });
      $("escena").appendChild(s);
    }
  }
  function salto() {
    var g = $("gato"); g.classList.remove("salta"); void g.offsetWidth; g.classList.add("salta");
  }

  function pintar() {
    $("panelForm").classList.toggle("oculto", !!estado && !$("panelForm").dataset.editando);
    $("juego").classList.toggle("oculto", !estado || !!$("panelForm").dataset.editando);
    if (!estado) return;

    var src = estado.foto || MICHI;
    $("foto").src = src;
    $("fondo").style.backgroundImage = "url(" + src + ")";
    var av = $("avatar");
    av.style.backgroundImage = "url(" + src + ")";
    if (estado.foto) { av.style.backgroundSize = "cover"; av.style.backgroundPosition = "center"; }
    else { av.style.backgroundSize = "270px auto"; av.style.backgroundPosition = "-195px -14px"; }
    $("foto").style.setProperty("--s", escala(estado.total));
    $("escena").classList.toggle("duerme", estado.durmiendo);

    var edad = estado.edad === 1 ? "1 año" : estado.edad + " años";
    $("vNombre").textContent = estado.nombre;
    $("vNivel").textContent = estado.nivel;
    var necesita = 200 * estado.nivel;
    $("xpBarra").style.width = (estado.xp / necesita * 100) + "%";
    $("xpTxt").textContent = estado.xp + " / " + necesita;
    $("vMonedas").textContent = estado.monedas;
    $("chip").textContent = etapa(estado.total) + " · " + estado.raza + ", " + estado.color.toLowerCase() + ", " + edad;

    var hoy = comidasHoy();
    $("cHoy").textContent = hoy; $("cMeta").textContent = estado.meta; $("cTotal").textContent = estado.total;
    $("tagHoy").textContent = hoy + "/" + estado.meta;
    var f = feliz();
    $("fBarra").style.width = f + "%"; $("fTxt").textContent = f + "%";
    $("tDormir").textContent = estado.durmiendo ? "Despertar" : "Dormir";
  }

  function dormido() {
    if (estado.durmiendo) { aviso(estado.nombre + " está durmiendo. Pulsa Despertar."); return true; }
    return false;
  }

  $("guardar").addEventListener("click", function () {
    var nombre = $("nombre").value.trim(), edad = parseFloat($("edad").value), meta = parseInt($("meta").value, 10);
    if (!nombre) { alert("Escribe el nombre de tu gato."); return; }
    if (isNaN(edad) || edad < 0) { alert("Escribe una edad válida."); return; }
    var prev = estado || { total: 0, log: [], xp: 0, nivel: 1, monedas: 0, feliz: 80, feliz_t: Date.now(), durmiendo: false, foto: null };
    estado = Object.assign(prev, { nombre: nombre, raza: $("raza").value.trim() || "Sin raza definida",
      color: $("color").value, edad: edad, meta: isNaN(meta) || meta < 1 ? 3 : meta });
    delete $("panelForm").dataset.editando;
    guardar(); pintar();
  });
  $("cancelar").addEventListener("click", function () { delete $("panelForm").dataset.editando; pintar(); });
  $("bEditar").addEventListener("click", function () {
    $("nombre").value = estado.nombre; $("raza").value = estado.raza; $("color").value = estado.color;
    $("edad").value = estado.edad; $("meta").value = estado.meta;
    $("cancelar").classList.remove("oculto");
    $("panelForm").dataset.editando = "1"; pintar();
  });

  $("bAlimentar").addEventListener("click", function () {
    if (dormido()) return;
    var hoy = comidasHoy();
    if (hoy >= estado.meta && !confirm(estado.nombre + " ya comió " + hoy + " veces hoy (meta: " + estado.meta + "). ¿Darle otra comida?")) return;
    estado.total++; estado.log.push(Date.now());
    sumarFeliz(6); ganar(40, 10);
    spawn("🍗", 3, "cae"); spawn("🐟", 3, "cae"); salto();
    var n = comidasHoy();
    aviso(n >= estado.meta ? estado.nombre + " completó sus " + estado.meta + " comidas de hoy." : "Le quedan " + (estado.meta - n) + " comida(s) hoy.");
    guardar(); pintar();
  });
  $("bCarino").addEventListener("click", function () {
    if (dormido()) return;
    sumarFeliz(5); ganar(5, 2); spawn("💖", 5); aviso(estado.nombre + " ronronea."); guardar(); pintar();
  });
  $("bJugar").addEventListener("click", function () {
    if (dormido()) return;
    sumarFeliz(8); ganar(10, 3); spawn("🎾", 3); spawn("⭐", 3); salto(); aviso(estado.nombre + " se divierte con la pelota."); guardar(); pintar();
  });
  $("bDormir").addEventListener("click", function () {
    estado.durmiendo = !estado.durmiendo;
    aviso(estado.durmiendo ? estado.nombre + " se fue a dormir." : estado.nombre + " se despertó."); guardar(); pintar();
  });

  $("bFoto").addEventListener("click", function () { $("archivo").click(); });
  $("archivo").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = im.width * k; c.height = im.height * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        estado.foto = c.toDataURL("image/jpeg", 0.82); guardar(); pintar();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f); e.target.value = "";
  });

  $("bReiniciar").addEventListener("click", function () {
    if (!confirm(estado.nombre + " volverá a su tamaño inicial y se borrarán las comidas, el nivel y las monedas. ¿Continuar?")) return;
    Object.assign(estado, { total: 0, log: [], xp: 0, nivel: 1, monedas: 0, feliz: 80, feliz_t: Date.now(), durmiendo: false });
    aviso(""); guardar(); pintar();
  });

  setInterval(function () { if (estado && estado.durmiendo) spawn("💤", 1); }, 1800);
  setInterval(function () { if (estado) pintar(); }, 60000);
  pintar();
})();
</script>
